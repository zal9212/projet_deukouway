upstream dekouway_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost dekouway.sn www.dekouway.sn;

    client_max_body_size 10M;

    # Headers de sécurité renforcés
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Défense en profondeur : les documents d'identité/selfies vivent physiquement
    # sous media/private/ mais ne doivent JAMAIS être servis en fichier statique.
    # Seule la vue Django authentifiée (apps.accounts.views.documents) peut les lire.
    location /media/private/ {
        deny all;
        return 403;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://dekouway_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
