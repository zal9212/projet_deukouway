{% extends "layouts/dashboard.html" %}

{% block title %}Paramètres - DEKOUWAY ERP{% endblock %}

{% block page_header %}
<div class="md:flex md:items-center md:justify-between mb-8 mt-2">
    <div class="min-w-0 flex-1">
        <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight">
            Paramètres Notifications
        </h2>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="space-y-10 divide-y divide-gray-900/10 max-w-4xl">
    
    <div class="grid grid-cols-1 gap-x-8 gap-y-8 md:grid-cols-3">
        <div class="px-4 sm:px-0">
            <h2 class="text-base font-semibold leading-7 text-gray-900">Alertes ERP</h2>
            <p class="mt-1 text-sm leading-6 text-gray-600">Choisissez quand être notifié.</p>
        </div>

        <form class="bg-white shadow-sm ring-1 ring-gray-900/5 sm:rounded-xl md:col-span-2 p-6">
            <div class="space-y-4">
                <label class="flex items-center space-x-3 text-sm">
                    <input type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-[#8B1E24] focus:ring-[#8B1E24]">
                    <span class="text-gray-900 font-medium">Nouvelle inscription Propriétaire (KYC à valider)</span>
                </label>
                <label class="flex items-center space-x-3 text-sm">
                    <input type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-[#8B1E24] focus:ring-[#8B1E24]">
                    <span class="text-gray-900 font-medium">Nouveau litige urgent</span>
                </label>
                <label class="flex items-center space-x-3 text-sm">
                    <input type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-[#8B1E24] focus:ring-[#8B1E24]">
                    <span class="text-gray-900 font-medium">Échec de paiement (Wave/OM/Stripe)</span>
                </label>
            </div>
            <div class="mt-6 border-t border-gray-200 pt-4 flex justify-end">
                <button type="submit" class="rounded-md bg-[#8B1E24] px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#6F171C]">Sauvegarder</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
