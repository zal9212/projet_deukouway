{% extends "base.html" %}

{% block title %}Supprimer le Logement - DEKOUWAY{% endblock %}

{% block content %}
<section class="max-w-md mx-auto py-16 px-4 sm:px-6 lg:px-8">
    <div class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 rounded-3xl p-8 shadow-lg text-center space-y-6">
        
        <span class="inline-flex p-3 bg-red-100 dark:bg-red-950/20 text-red-600 rounded-full">
            <i data-lucide="trash-2" class="w-10 h-10"></i>
        </span>

        <div>
            <h2 class="text-2xl font-extrabold tracking-tight">Supprimer le Logement</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">
                Êtes-vous sûr de vouloir supprimer le logement <strong>"{{ object.title }}"</strong> ? Cette action est irréversible.
            </p>
        </div>

        <form action="" method="POST" class="flex flex-col sm:flex-row gap-4 justify-center pt-4">
            {% csrf_token %}
            
            <a href="{% url 'owner_dashboard' %}" class="w-full sm:w-auto px-6 py-3 border border-slate-200 hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800 rounded-xl text-sm font-bold transition-all">
                Annuler
            </a>
            
            <button type="submit" class="w-full sm:w-auto px-8 py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-bold shadow-md hover:shadow-lg transition-all">
                Confirmer la suppression
            </button>
        </form>
        
    </div>
</section>
{% endblock %}
