<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#FAFAFA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DEKOUWAY - Votre logement en un clic{% endblock %}</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="{% block meta_description %}Trouvez, réservez et vivez dans les plus beaux logements du Sénégal avec DEKOUWAY.{% endblock %}">
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B1E24',
                        'primary-hover': '#6F171C',
                        secondary: '#A52A2F',
                        accent: '#C89B3C',
                        background: '#FAFAFA',
                        surface: '#FFFFFF',
                        border: '#E5E7EB',
                        'text-primary': '#1F2937',
                        'text-secondary': '#6B7280',
                        muted: '#9CA3AF',
                        success: '#16A34A',
                        warning: '#F59E0B',
                        danger: '#DC2626',
                        info: '#2563EB',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    borderRadius: {
                        '4': '4px',
                        '8': '8px',
                        '12': '12px',
                        '16': '16px',
                        '20': '20px',
                        '24': '24px',
                        '32': '32px',
                    }
                }
            }
        }
    </script>
    
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- AlpineJS CDN -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Leaflet.js (For maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        [x-cloak] { display: none !important; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FAFAFA;
            color: #1F2937;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full flex flex-col font-sans antialiased text-[#1F2937]">
    
    <!-- Render main structure based on layout extensions -->
    {% block layout %}{% endblock %}

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
        document.body.addEventListener('htmx:afterSwap', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
