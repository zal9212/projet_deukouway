<form method="GET" action="{% url 'properties_list' %}" class="inline-block" id="sort-form">
    <!-- Preserve all active search parameters except sort -->
    {% for key, val in request.GET.items %}
        {% if key != 'sort' %}
            <input type="hidden" name="{{ key }}" value="{{ val }}">
        {% endif %}
    {% endfor %}

    <!-- Accessible Label -->
    <label for="sort-select" class="sr-only">Trier les logements</label>

    <!-- Sort selector dropdown -->
    <select name="sort" id="sort-select" 
            hx-get="{% url 'properties_list' %}"
            hx-trigger="change"
            hx-target="#property-cards-container"
            hx-push-url="true"
            hx-indicator="#loading-indicator"
            aria-label="Trier les résultats"
            class="px-3.5 py-2.5 bg-white border border-[#E5E7EB] rounded-xl text-xs font-semibold focus:ring-1 focus:ring-[#8B1E24] text-[#1F2937] focus:outline-none cursor-pointer">
        <option value="newest" {% if request.GET.sort == 'newest' or not request.GET.sort %}selected{% endif %}>Trier : Plus récents</option>
        <option value="price_asc" {% if request.GET.sort == 'price_asc' %}selected{% endif %}>Trier : Prix croissant</option>
        <option value="price_desc" {% if request.GET.sort == 'price_desc' %}selected{% endif %}>Trier : Prix décroissant</option>
        <option value="popularity" {% if request.GET.sort == 'popularity' %}selected{% endif %}>Trier : Popularité</option>
        <option value="rating" {% if request.GET.sort == 'rating' %}selected{% endif %}>Trier : Les mieux notés</option>
    </select>
</form>
