<span class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-semibold tracking-wider select-none {{ color_class|default:'bg-[#E5E7EB] text-[#1F2937]' }} {{ extra_class }}">
    {% if icon %}
        <i data-lucide="{{ icon }}" class="w-3.5 h-3.5 mr-1"></i>
    {% endif %}
    <span>{{ text }}</span>
</span>
