<form action="{% url 'properties_list' %}" method="get" class="w-full bg-white border border-[#E5E7EB] rounded-2xl p-4 shadow-sm space-y-3 md:space-y-0 md:flex md:items-center md:gap-3 {{ extra_class }}">
    <!-- City input section -->
    <div class="flex-grow flex items-center space-x-2 px-3 py-2 border-b md:border-b-0 md:border-r border-[#E5E7EB]">
        <i data-lucide="map-pin" class="w-4 h-4 text-[#8B1E24] flex-shrink-0"></i>
        <div class="w-full">
            <label for="search_city" class="sr-only">Ville</label>
            <input type="text" name="city" id="search_city" 
                   value="{{ request.GET.city|default:'' }}" 
                   placeholder="Ville (Dakar, Saly...)" 
                   aria-label="Rechercher par ville"
                   class="w-full bg-transparent border-none p-0 text-xs focus:ring-0 placeholder-[#9CA3AF] focus:outline-none text-[#1F2937]">
        </div>
    </div>

    <!-- Neighborhood input section -->
    <div class="flex-grow flex items-center space-x-2 px-3 py-2 border-b md:border-b-0 md:border-r border-[#E5E7EB]">
        <i data-lucide="navigation" class="w-4 h-4 text-[#8B1E24] flex-shrink-0"></i>
        <div class="w-full">
            <label for="search_neighborhood" class="sr-only">Quartier</label>
            <input type="text" name="neighborhood" id="search_neighborhood" 
                   value="{{ request.GET.neighborhood|default:'' }}" 
                   placeholder="Quartier (Ngor, Plateau...)" 
                   aria-label="Rechercher par quartier"
                   class="w-full bg-transparent border-none p-0 text-xs focus:ring-0 placeholder-[#9CA3AF] focus:outline-none text-[#1F2937]">
        </div>
    </div>

    <!-- Address input section -->
    <div class="flex-grow flex items-center space-x-2 px-3 py-2 border-b md:border-b-0 md:border-r border-[#E5E7EB]">
        <i data-lucide="map" class="w-4 h-4 text-[#8B1E24] flex-shrink-0"></i>
        <div class="w-full">
            <label for="search_address" class="sr-only">Adresse</label>
            <input type="text" name="address" id="search_address" 
                   value="{{ request.GET.address|default:'' }}" 
                   placeholder="Adresse" 
                   aria-label="Rechercher par adresse"
                   class="w-full bg-transparent border-none p-0 text-xs focus:ring-0 placeholder-[#9CA3AF] focus:outline-none text-[#1F2937]">
        </div>
    </div>

    <!-- General / Free text search input section -->
    <div class="flex-grow flex items-center space-x-2 px-3 py-2 border-b md:border-b-0 md:border-r border-[#E5E7EB]">
        <i data-lucide="search" class="w-4 h-4 text-[#8B1E24] flex-shrink-0"></i>
        <div class="w-full">
            <label for="search_free" class="sr-only">Recherche libre</label>
            <input type="text" name="search" id="search_free" 
                   value="{{ request.GET.search|default:'' }}" 
                   placeholder="Recherche libre..." 
                   aria-label="Recherche textuelle libre"
                   class="w-full bg-transparent border-none p-0 text-xs focus:ring-0 placeholder-[#9CA3AF] focus:outline-none text-[#1F2937]">
        </div>
    </div>

    <!-- Search submission button -->
    <div class="flex-shrink-0 pt-2 md:pt-0">
        <button type="submit" 
                aria-label="Lancer la recherche"
                class="w-full md:w-auto px-5 py-3 bg-[#8B1E24] hover:bg-[#6F171C] text-white text-xs font-bold rounded-xl shadow-sm transition-colors flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-[#8B1E24] cursor-pointer">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>Rechercher</span>
        </button>
    </div>
</form>
