<div class="bg-white border border-[#E5E7EB] rounded-2xl p-6 shadow-sm {{ extra_class }}">
    <!-- Title Header -->
    <h3 class="text-xs font-bold text-[#1F2937] uppercase tracking-wider mb-5 flex items-center select-none">
        <i data-lucide="sliders" class="w-4 h-4 mr-2 text-[#8B1E24]"></i>
        Filtres de recherche
    </h3>

    <form method="GET" action="{% url 'properties_list' %}" class="space-y-6">
        <!-- Keep current search term if present -->
        {% if request.GET.search %}
            <input type="hidden" name="search" value="{{ request.GET.search }}">
        {% endif %}
        {% if request.GET.sort %}
            <input type="hidden" name="sort" value="{{ request.GET.sort }}">
        {% endif %}

        <!-- Budget / Price range selection -->
        <div class="space-y-2">
            <span class="block text-[10px] font-bold text-[#6B7280] uppercase tracking-wider">Budget (FCFA)</span>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="price_min" class="sr-only">Prix minimum</label>
                    <input type="number" name="price_min" id="price_min" 
                           value="{{ request.GET.price_min|default:'' }}" 
                           placeholder="Min" 
                           aria-label="Prix minimum en FCFA"
                           class="w-full px-3 py-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl text-xs focus:ring-1 focus:ring-[#8B1E24] text-[#1F2937] focus:outline-none placeholder-[#9CA3AF]">
                </div>
                <div>
                    <label for="price_max" class="sr-only">Prix maximum</label>
                    <input type="number" name="price_max" id="price_max" 
                           value="{{ request.GET.price_max|default:'' }}" 
                           placeholder="Max" 
                           aria-label="Prix maximum en FCFA"
                           class="w-full px-3 py-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl text-xs focus:ring-1 focus:ring-[#8B1E24] text-[#1F2937] focus:outline-none placeholder-[#9CA3AF]">
                </div>
            </div>
        </div>

        <!-- Housing Type -->
        <div class="space-y-2">
            <label for="housing_type" class="block text-[10px] font-bold text-[#6B7280] uppercase tracking-wider">Type de logement</label>
            <select name="type" id="housing_type"
                    aria-label="Sélectionner le type de logement"
                    class="w-full px-3 py-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl text-xs focus:ring-1 focus:ring-[#8B1E24] text-[#1F2937] focus:outline-none cursor-pointer">
                <option value="">Tous les types</option>
                {% for property_type in types %}
                <option value="{{ property_type.slug }}" {% if request.GET.type == property_type.slug %}selected{% endif %}>{{ property_type.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Capacity / Rooms / Bathrooms counts selection -->
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
                <label for="bedrooms" class="block text-[10px] font-bold text-[#6B7280] uppercase tracking-wider">Chambres</label>
                <select name="bedrooms" id="bedrooms" 
                        aria-label="Nombre de chambres"
                        class="w-full px-3 py-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl text-xs focus:ring-1 focus:ring-[#8B1E24] text-[#1F2937] focus:outline-none cursor-pointer">
                    <option value="">Indifférent</option>
                    <option value="1" {% if request.GET.bedrooms == '1' %}selected{% endif %}>1</option>
                    <option value="2" {% if request.GET.bedrooms == '2' %}selected{% endif %}>2</option>
                    <option value="3" {% if request.GET.bedrooms == '3' %}selected{% endif %}>3</option>
                    <option value="4" {% if request.GET.bedrooms == '4' %}selected{% endif %}>4+</option>
                </select>
            </div>
            <div class="space-y-2">
                <label for="bathrooms" class="block text-[10px] font-bold text-[#6B7280] uppercase tracking-wider">Salles de bain</label>
                <select name="bathrooms" id="bathrooms" 
                        aria-label="Nombre de salles de bain"
                        class="w-full px-3 py-2.5 bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl text-xs focus:ring-1 focus:ring-[#8B1E24] text-[#1F2937] focus:outline-none cursor-pointer">
                    <option value="">Indifférent</option>
                    <option value="1" {% if request.GET.bathrooms == '1' %}selected{% endif %}>1</option>
                    <option value="2" {% if request.GET.bathrooms == '2' %}selected{% endif %}>2</option>
                    <option value="3" {% if request.GET.bathrooms == '3' %}selected{% endif %}>3+</option>
                </select>
            </div>
        </div>

        <!-- Amenities / Equipments checkboxes selection -->
        <div class="space-y-3">
            <span class="block text-[10px] font-bold text-[#6B7280] uppercase tracking-wider">Équipements & Options</span>
            <div class="space-y-2.5">
                <label class="flex items-center text-xs font-medium text-[#1F2937] cursor-pointer">
                    <input type="checkbox" name="wifi" value="1" {% if request.GET.wifi %}checked{% endif %}
                           class="w-4 h-4 rounded border-[#E5E7EB] text-[#8B1E24] focus:ring-[#8B1E24] mr-2.5 cursor-pointer">
                    <span>Accès WiFi gratuit</span>
                </label>
                <label class="flex items-center text-xs font-medium text-[#1F2937] cursor-pointer">
                    <input type="checkbox" name="climatisation" value="1" {% if request.GET.climatisation %}checked{% endif %}
                           class="w-4 h-4 rounded border-[#E5E7EB] text-[#8B1E24] focus:ring-[#8B1E24] mr-2.5 cursor-pointer">
                    <span>Climatisation</span>
                </label>
                <label class="flex items-center text-xs font-medium text-[#1F2937] cursor-pointer">
                    <input type="checkbox" name="parking" value="1" {% if request.GET.parking %}checked{% endif %}
                           class="w-4 h-4 rounded border-[#E5E7EB] text-[#8B1E24] focus:ring-[#8B1E24] mr-2.5 cursor-pointer">
                    <span>Parking privé gratuit</span>
                </label>
                <label class="flex items-center text-xs font-medium text-[#1F2937] cursor-pointer">
                    <input type="checkbox" name="piscine" value="1" {% if request.GET.piscine %}checked{% endif %}
                           class="w-4 h-4 rounded border-[#E5E7EB] text-[#8B1E24] focus:ring-[#8B1E24] mr-2.5 cursor-pointer">
                    <span>Piscine</span>
                </label>
            </div>
        </div>

        <!-- Filter Actions -->
        <div class="grid grid-cols-2 gap-3 pt-4 border-t border-[#E5E7EB]">
            <a href="{% url 'properties_list' %}" 
               aria-label="Réinitialiser tous les filtres de recherche"
               class="py-3 text-center border border-[#E5E7EB] hover:bg-[#FAFAFA] text-[#1F2937] text-xs font-bold rounded-xl transition-colors block">
                Réinitialiser
            </a>
            <button type="submit" 
                    aria-label="Appliquer les filtres sélectionnés"
                    class="py-3 bg-[#8B1E24] hover:bg-[#6F171C] text-white text-xs font-bold rounded-xl shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-[#8B1E24]">
                Appliquer
            </button>
        </div>
    </form>
</div>
