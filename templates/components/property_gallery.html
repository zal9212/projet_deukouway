<div class="relative w-full mt-4 md:mt-6 mb-8 group" x-data="{ lightboxOpen: false }">
    
    <!-- Desktop Layout (Hidden on Mobile) -->
    <div class="hidden md:grid grid-cols-4 grid-rows-2 gap-2 h-[50vh] min-h-[400px] max-h-[600px] rounded-2xl overflow-hidden">
        <!-- Main Image -->
        <div class="col-span-2 row-span-2 relative cursor-pointer hover:opacity-90 transition-opacity" @click="lightboxOpen = true">
            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&q=80&w=1200" alt="Vue principale du logement" class="w-full h-full object-cover" loading="eager">
        </div>
        <!-- Thumbnail 1 -->
        <div class="col-span-1 row-span-1 relative cursor-pointer hover:opacity-90 transition-opacity" @click="lightboxOpen = true">
            <img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&q=80&w=600" alt="Salon" class="w-full h-full object-cover" loading="lazy">
        </div>
        <!-- Thumbnail 2 -->
        <div class="col-span-1 row-span-1 relative cursor-pointer hover:opacity-90 transition-opacity" @click="lightboxOpen = true">
            <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=80&w=600" alt="Chambre" class="w-full h-full object-cover" loading="lazy">
        </div>
        <!-- Thumbnail 3 -->
        <div class="col-span-1 row-span-1 relative cursor-pointer hover:opacity-90 transition-opacity" @click="lightboxOpen = true">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=600" alt="Cuisine" class="w-full h-full object-cover" loading="lazy">
        </div>
        <!-- Thumbnail 4 -->
        <div class="col-span-1 row-span-1 relative cursor-pointer hover:opacity-90 transition-opacity" @click="lightboxOpen = true">
            <img src="https://images.unsplash.com/photo-1600566752355-35792bedcfea?auto=format&fit=crop&q=80&w=600" alt="Salle de bain" class="w-full h-full object-cover" loading="lazy">
        </div>
    </div>

    <!-- Mobile Layout (Horizontal Snap Slider) -->
    <div class="md:hidden flex overflow-x-auto snap-x snap-mandatory no-scrollbar w-full h-[60vw] max-h-[350px]">
        <div class="snap-center shrink-0 w-full h-full">
            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&q=80&w=800" alt="Vue principale" class="w-full h-full object-cover" loading="eager">
        </div>
        <div class="snap-center shrink-0 w-full h-full">
            <img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&q=80&w=800" alt="Salon" class="w-full h-full object-cover" loading="lazy">
        </div>
        <div class="snap-center shrink-0 w-full h-full">
            <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=80&w=800" alt="Chambre" class="w-full h-full object-cover" loading="lazy">
        </div>
    </div>

    <!-- Bouton Afficher toutes les photos -->
    <button @click="lightboxOpen = true" 
            class="absolute bottom-4 right-4 md:bottom-6 md:right-6 bg-white border border-gray-900 text-gray-900 px-4 py-2 rounded-lg font-semibold text-sm shadow-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900 transition-colors flex items-center z-10"
            aria-label="Afficher toutes les photos">
        <i data-lucide="grid-3x3" class="w-4 h-4 mr-2"></i>
        Afficher toutes les photos
    </button>

    <!-- Placeholder Lightbox (Modal) -->
    <div x-show="lightboxOpen" 
         x-cloak
         @keydown.escape.window="lightboxOpen = false"
         class="fixed inset-0 z-[100] bg-white flex flex-col"
         aria-modal="true" role="dialog">
        <div class="p-4 flex justify-between items-center border-b border-gray-200">
            <h2 class="text-lg font-bold text-gray-900">Galerie de photos</h2>
            <button @click="lightboxOpen = false" class="p-2 rounded-full hover:bg-gray-100 transition-colors text-gray-700">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 md:p-8 flex justify-center">
            <div class="max-w-4xl w-full flex flex-col gap-6">
                <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&q=80&w=1200" alt="Photo" class="w-full rounded-lg" loading="lazy">
                <img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&q=80&w=1200" alt="Photo" class="w-full rounded-lg" loading="lazy">
                <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=80&w=1200" alt="Photo" class="w-full rounded-lg" loading="lazy">
            </div>
        </div>
    </div>
</div>
