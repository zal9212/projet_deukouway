<div class="bg-white border border-[#E5E7EB] rounded-2xl p-6 shadow-sm {{ extra_class }}">
    <div class="flex items-center justify-between">
        <span class="text-[#6B7280] block text-xs font-semibold uppercase tracking-wider">{{ label }}</span>
        {% if icon %}
            <span class="p-2 bg-[#FAFAFA] rounded-lg text-[#8B1E24]">
                <i data-lucide="{{ icon }}" class="w-4 h-4"></i>
            </span>
        {% endif %}
    </div>
    <span class="text-2xl font-extrabold text-[#1F2937] mt-3 block">{{ value }}</span>
    {% if change %}
        <span class="text-xs font-semibold mt-1.5 inline-block {% if 'up' in direction %} text-[#16A34A] {% else %} text-[#DC2626] {% endif %}">
            {{ change }}
        </span>
    {% endif %}
</div>
