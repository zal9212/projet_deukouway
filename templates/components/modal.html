<div x-data="{ open: false }" 
     @open-modal.window="if ($event.detail.id === '{{ modal_id }}') open = true" 
     @close-modal.window="if ($event.detail.id === '{{ modal_id }}') open = false"
     x-show="open" 
     x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 transition-opacity">
    <div @click.outside="open = false" 
         class="bg-white border border-[#E5E7EB] rounded-2xl max-w-md w-full p-6 shadow-lg relative space-y-4">
        <button @click="open = false" class="absolute top-4 right-4 text-[#6B7280] hover:text-[#1F2937]">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <h3 class="text-lg font-bold text-[#1F2937]">{{ title }}</h3>
        <div class="text-sm text-[#6B7280]">
            {{ body }}
        </div>
        <div class="flex justify-end space-x-3 pt-4 border-t border-[#E5E7EB]">
            <button @click="open = false" class="px-4 py-2 border border-[#E5E7EB] rounded-lg text-sm font-semibold hover:bg-[#FAFAFA] text-[#1F2937]">
                Annuler
            </button>
            {% block modal_action %}{% endblock %}
        </div>
    </div>
</div>
