<aside x-data="{ open: false }" 
       @toggle-sidebar.window="open = !open"
       :class="open ? 'translate-x-0' : '-translate-x-full'"
       class="fixed md:relative top-0 left-0 h-screen w-64 bg-white border-r border-[#E5E7EB] z-40 transform md:translate-x-0 transition-transform duration-200 flex flex-col justify-between">
    
    <div>
        <!-- Logo block -->
        <div class="h-16 border-b border-[#E5E7EB] flex items-center justify-between px-6">
            <a href="{% url 'home' %}" class="flex items-center space-x-2">
                <span class="p-2 bg-[#8B1E24] rounded-lg text-white">
                    <i data-lucide="home" class="w-4 h-4"></i>
                </span>
                <span class="text-lg font-bold text-[#1F2937]">DEKOUWAY</span>
            </a>
            <!-- Mobile close button -->
            <button @click="open = false" class="md:hidden p-1 text-[#6B7280] hover:bg-[#FAFAFA] rounded">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Links -->
        <nav class="p-4 space-y-1">
            {% if user.role == 'owner' %}
                <!-- Owner links -->
                <a href="{% url 'owner_dashboard' %}" class="flex items-center px-4 py-2.5 text-sm font-semibold rounded-lg space-x-3 {% if request.resolver_match.url_name == 'owner_dashboard' %} bg-[#8B1E24] text-white {% else %} text-[#1F2937] hover:bg-[#FAFAFA] {% endif %} transition-colors">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Tableau de bord</span>
                </a>
                <a href="{% url 'owner_properties' %}" class="flex items-center px-4 py-2.5 text-sm font-semibold rounded-lg space-x-3 {% if request.resolver_match.url_name == 'owner_properties' or request.resolver_match.url_name == 'property_create' or request.resolver_match.url_name == 'property_update' %} bg-[#8B1E24] text-white {% else %} text-[#1F2937] hover:bg-[#FAFAFA] {% endif %} transition-colors">
                    <i data-lucide="building" class="w-4 h-4"></i>
                    <span>Mes Biens</span>
                </a>
                <a href="{% url 'owner_bookings' %}" class="flex items-center px-4 py-2.5 text-sm font-semibold rounded-lg space-x-3 {% if request.resolver_match.url_name == 'owner_bookings' %} bg-[#8B1E24] text-white {% else %} text-[#1F2937] hover:bg-[#FAFAFA] {% endif %} transition-colors">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>Réservations</span>
                </a>
            {% elif user.role == 'admin' or user.is_superuser %}
                <!-- Admin links -->
                <a href="{% url 'admin_dashboard' %}" class="flex items-center px-4 py-2.5 text-sm font-semibold rounded-lg space-x-3 {% if request.resolver_match.url_name == 'admin_dashboard' %} bg-[#8B1E24] text-white {% else %} text-[#1F2937] hover:bg-[#FAFAFA] {% endif %} transition-colors">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Vue d'ensemble</span>
                </a>
                <a href="{% url 'admin_validation' %}" class="flex items-center px-4 py-2.5 text-sm font-semibold rounded-lg space-x-3 {% if request.resolver_match.url_name == 'admin_validation' %} bg-[#8B1E24] text-white {% else %} text-[#1F2937] hover:bg-[#FAFAFA] {% endif %} transition-colors">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    <span>Validations</span>
                </a>
                <a href="{% url 'admin_properties' %}" class="flex items-center px-4 py-2.5 text-sm font-semibold rounded-lg space-x-3 {% if request.resolver_match.url_name == 'admin_properties' %} bg-[#8B1E24] text-white {% else %} text-[#1F2937] hover:bg-[#FAFAFA] {% endif %} transition-colors">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span>Logements</span>
                </a>
                <a href="{% url 'admin_users' %}" class="flex items-center px-4 py-2.5 text-sm font-semibold rounded-lg space-x-3 {% if request.resolver_match.url_name == 'admin_users' %} bg-[#8B1E24] text-white {% else %} text-[#1F2937] hover:bg-[#FAFAFA] {% endif %} transition-colors">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span>Utilisateurs</span>
                </a>
            {% endif %}
        </nav>
    </div>

    <!-- Sidebar footer (Logout button) -->
    <div class="p-4 border-t border-[#E5E7EB]">
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="w-full flex items-center px-4 py-2.5 text-sm font-semibold text-[#DC2626] hover:bg-red-50 rounded-lg space-x-3 transition-colors">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>Déconnexion</span>
            </button>
        </form>
    </div>
</aside>

<!-- Background backdrop overlay for mobile sidebar -->
<div x-data="{ open: false }" 
     @toggle-sidebar.window="open = !open" 
     x-show="open" 
     x-cloak 
     @click="open = false; $dispatch('toggle-sidebar')" 
     class="md:hidden fixed inset-0 bg-black/40 z-30 transition-opacity"></div>
