<div class="sticky top-20 z-30 w-full flex justify-center items-center gap-4 px-4 py-3 bg-white/80 backdrop-blur-md border-b border-gray-200/50 shadow-sm transition-all duration-300">
    <form action="{% url 'properties_list' %}" method="get" class="flex items-center bg-white border border-gray-300 rounded-full shadow-md hover:shadow-lg transition-shadow duration-300 divide-x divide-gray-200">
        
        <!-- Ville / Quartier (combiné) -->
        <div class="px-4 py-2 hover:bg-gray-100 rounded-l-full cursor-pointer transition-colors">
            <label for="floating_search_location" class="block text-[10px] font-bold text-gray-900 tracking-wider uppercase">Ville / Quartier</label>
            <input type="text" name="location" id="floating_search_location"
                   value="{{ request.GET.location|default:'' }}"
                   placeholder="Où allez-vous ?"
                   class="w-full bg-transparent border-none p-0 text-sm focus:ring-0 placeholder-gray-500 text-gray-900 focus:outline-none truncate w-32 sm:w-44">
        </div>

        <!-- Recherche / Bouton -->
        <div class="flex items-center pl-4 pr-2 py-2 hover:bg-gray-100 rounded-r-full cursor-pointer transition-colors">
            <div class="mr-2 hidden md:block">
                <label for="floating_search_free" class="block text-[10px] font-bold text-gray-900 tracking-wider uppercase">Mot-clé</label>
                <input type="text" name="search" id="floating_search_free" 
                       value="{{ request.GET.search|default:'' }}" 
                       placeholder="Recherche libre" 
                       class="w-full bg-transparent border-none p-0 text-sm focus:ring-0 placeholder-gray-500 text-gray-900 focus:outline-none truncate w-32">
            </div>
            <button type="submit" aria-label="Rechercher" class="w-10 h-10 rounded-full bg-[#8B1E24] hover:bg-[#6F171C] text-white flex items-center justify-center transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#8B1E24]">
                <i data-lucide="search" class="w-4 h-4"></i>
            </button>
        </div>
        
    </form>

    <!-- Bouton Voir Carte (Desktop uniquement) -->
    <button @click="showMap = !showMap" type="button" class="hidden lg:flex items-center space-x-2 px-5 py-3 bg-[#8B1E24] text-white rounded-full shadow-md hover:shadow-lg hover:bg-[#6F171C] transition-all duration-300 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#8B1E24]">
        <span x-text="showMap ? 'Masquer carte' : 'Voir carte'">Voir carte</span>
        <i data-lucide="map" class="w-4 h-4 ml-1" x-show="!showMap"></i>
        <i data-lucide="list" class="w-4 h-4 ml-1" x-show="showMap" x-cloak></i>
    </button>
</div>
