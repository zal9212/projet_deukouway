<div class="mb-4" x-data="{ show: false }">
    <div class="flex justify-between">
        <label for="{{ id }}" class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
        {% if forgot_link %}
        <div class="text-sm">
            <a href="{{ forgot_link }}" class="font-semibold text-[#8B1E24] hover:text-[#6F171C]">Mot de passe oublié ?</a>
        </div>
        {% endif %}
    </div>
    
    <div class="relative rounded-md shadow-sm">
        <input :type="show ? 'text' : 'password'" 
               name="{{ name }}" 
               id="{{ id }}"
               {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
               {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
               {% if minlength %}minlength="{{ minlength }}"{% endif %}
               {% if required %}required{% endif %}
               class="block w-full rounded-lg border-0 py-2.5 pl-3.5 pr-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-[#8B1E24] sm:text-sm sm:leading-6 transition-shadow">
               
        <button type="button" 
                @click="show = !show"
                class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 focus:outline-none"
                :aria-label="show ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
            <!-- Icône Oeil (caché) -->
            <i data-lucide="eye-off" class="h-5 w-5" x-show="show" x-cloak></i>
            <!-- Icône Oeil (visible) -->
            <i data-lucide="eye" class="h-5 w-5" x-show="!show"></i>
        </button>
    </div>
</div>
