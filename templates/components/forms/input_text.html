<div class="mb-4">
    <label for="{{ id }}" class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
    <div class="relative rounded-md shadow-sm">
        <input type="{{ type|default:'text' }}" 
               name="{{ name }}" 
               id="{{ id }}"
               {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
               {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
               {% if required %}required{% endif %}
               class="block w-full rounded-lg border-0 py-2.5 px-3.5 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-[#8B1E24] sm:text-sm sm:leading-6 transition-shadow">
    </div>
</div>
