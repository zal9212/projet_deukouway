<div class="bg-white border border-[#E5E7EB] rounded-2xl p-6 shadow-sm {{ extra_class }}">
    {% if title %}
        <div class="flex items-center justify-between border-b border-[#E5E7EB] pb-4 mb-6">
            <h3 class="text-base font-bold text-[#1F2937] flex items-center">
                {% if icon %}
                    <i data-lucide="{{ icon }}" class="w-4 h-4 mr-2 text-[#8B1E24]"></i>
                {% endif %}
                {{ title }}
            </h3>
            {% if action_url %}
                <a href="{{ action_url }}" class="text-xs font-semibold text-[#8B1E24] hover:underline">{{ action_label|default:'Voir tout' }}</a>
            {% endif %}
        </div>
    {% endif %}
    <div>
        {{ content }}
    </div>
</div>
