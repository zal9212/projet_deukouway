<div class="mb-8">
    <nav aria-label="Progress">
        <ol role="list" class="flex items-center">
            <!-- Etape 1 -->
            <li class="relative pr-8 sm:pr-20">
                <div class="absolute inset-0 flex items-center" aria-hidden="true">
                    <div class="h-0.5 w-full {% if current_step >= 2 %}bg-[#8B1E24]{% else %}bg-gray-200{% endif %}"></div>
                </div>
                <a href="#" class="relative flex h-8 w-8 items-center justify-center rounded-full {% if current_step >= 1 %}bg-[#8B1E24] hover:bg-[#6F171C]{% else %}bg-gray-200 hover:bg-gray-300{% endif %} focus:outline-none focus:ring-2 focus:ring-[#8B1E24] focus:ring-offset-2">
                    {% if current_step > 1 %}
                    <i data-lucide="check" class="h-5 w-5 text-white"></i>
                    {% else %}
                    <span class="text-white font-bold text-sm">1</span>
                    {% endif %}
                </a>
            </li>
            
            <!-- Etape 2 -->
            <li class="relative">
                <a href="#" class="relative flex h-8 w-8 items-center justify-center rounded-full {% if current_step >= 2 %}bg-[#8B1E24] hover:bg-[#6F171C]{% else %}bg-gray-200 hover:bg-gray-300{% endif %} focus:outline-none focus:ring-2 focus:ring-[#8B1E24] focus:ring-offset-2">
                    <span class="{% if current_step >= 2 %}text-white{% else %}text-gray-500{% endif %} font-bold text-sm">2</span>
                </a>
            </li>
        </ol>
    </nav>
</div>
