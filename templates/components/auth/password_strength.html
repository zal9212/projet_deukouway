<div class="mt-2 mb-4" x-data="{ 
    pass: '',
    score() {
        let p = this.pass;
        if (!p || p.length === 0) return 0;
        let s = 1;
        if (p.length >= 8) s++;
        if (/[A-Z]/.test(p)) s++;
        if (/[0-9]/.test(p)) s++;
        if (/[^A-Za-z0-9]/.test(p)) s++;
        return Math.min(s, 5);
    },
    labels: ['Très faible', 'Très faible', 'Faible', 'Moyen', 'Fort', 'Très fort'],
    colors: ['bg-slate-200', 'bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-emerald-500', 'bg-emerald-600']
}"
@input.window="if ($event.target && ($event.target.id === '{{ input_id|default:"password1" }}' || $event.target.id === 'password' || $event.target.id === 'id_new_password1' || $event.target.name === 'password1' || $event.target.name === 'password')) pass = $event.target.value">
    <!-- Barres de force -->
    <div class="flex gap-1 h-1.5 w-full">
        <template x-for="i in 5" :key="i">
            <div class="flex-1 rounded-full transition-all duration-300"
                 :class="i <= score() ? colors[score()] : 'bg-slate-200'">
            </div>
        </template>
    </div>
    
    <!-- Texte d'aide -->
    <div class="flex justify-between items-center mt-1.5">
        <span class="text-xs font-medium" 
              :class="score() === 0 ? 'text-slate-400' : (score() <= 2 ? 'text-red-600' : (score() === 3 ? 'text-amber-600' : 'text-emerald-600'))"
              x-text="labels[score()]">
        </span>
        <span class="text-[10px] text-slate-500">8 caractères min. (Majuscule, chiffre, symbole)</span>
    </div>
</div>
