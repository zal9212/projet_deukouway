<div class="mt-2 mb-4" x-data="{ 
    score() {
        if (password.length === 0) return 0;
        let s = 1; // très faible par défaut si non vide
        if (password.length >= 8) s++;
        if (/[A-Z]/.test(password)) s++;
        if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) s++;
        if (password.length >= 12 && s >= 3) s = 5;
        return Math.min(s, 5);
    },
    labels: ['Très faible', 'Très faible', 'Faible', 'Moyen', 'Fort', 'Très fort'],
    colors: ['bg-gray-200', 'bg-red-500', 'bg-orange-500', 'bg-yellow-500', 'bg-green-400', 'bg-green-600']
}">
    <!-- Barres de force -->
    <div class="flex gap-1 h-1.5 w-full">
        <template x-for="i in 5">
            <div class="flex-1 rounded-full transition-colors duration-300"
                 :class="i <= score() ? colors[score()] : 'bg-gray-200'">
            </div>
        </template>
    </div>
    
    <!-- Texte d'aide -->
    <div class="flex justify-between items-center mt-1.5">
        <span class="text-xs font-medium" 
              :class="score() === 0 ? 'text-gray-400' : (score() <= 2 ? 'text-red-600' : (score() === 3 ? 'text-yellow-600' : 'text-green-600'))"
              x-text="labels[score()]">
        </span>
        <span class="text-[10px] text-gray-500">8 caractères min. (Majuscule, chiffre, symbole)</span>
    </div>
</div>
