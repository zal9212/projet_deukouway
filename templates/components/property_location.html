<div class="py-6 border-b border-gray-200">
    <h3 class="text-xl font-bold text-gray-900 mb-2">Où se situe le logement</h3>
    <p class="text-gray-600 mb-6">Almadies, Dakar, Sénégal</p>
    
    <div class="w-full h-[400px] bg-gray-100 rounded-2xl overflow-hidden relative z-0" x-data="propertyMap()" x-init="initMap()">
        <div id="detail-map" class="w-full h-full"></div>
    </div>
    
    <div class="mt-4">
        <h4 class="font-bold text-gray-900">Almadies</h4>
        <p class="text-gray-700 mt-2 line-clamp-3">
            Quartier très prisé et sécurisé, réputé pour ses nombreux restaurants en bord de mer, ses boîtes de nuit, et son ambiance cosmopolite. La pointe des Almadies est le point le plus à l'ouest du continent africain.
        </p>
        <button class="mt-2 font-bold text-gray-900 underline hover:text-gray-600 focus:outline-none transition-colors">
            En savoir plus sur le quartier
        </button>
    </div>
</div>

<script>
    function propertyMap() {
        return {
            map: null,
            initMap() {
                // S'assurer que le DOM est prêt et Leaflet est chargé
                setTimeout(() => {
                    if (typeof L === 'undefined') return;
                    
                    const lat = 14.7450;
                    const lng = -17.5150; // Pointe des Almadies
                    
                    this.map = L.map('detail-map', {
                        scrollWheelZoom: false // Désactivé par défaut pour ne pas bloquer le scroll de la page
                    }).setView([lat, lng], 15);
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; OpenStreetMap, &copy; CARTO',
                        maxZoom: 19
                    }).addTo(this.map);
                    
                    // Style Airbnb : afficher un cercle translucide plutôt qu'un marqueur précis pour des raisons de confidentialité
                    L.circle([lat, lng], {
                        color: '#8B1E24',
                        fillColor: '#8B1E24',
                        fillOpacity: 0.3,
                        radius: 300 // rayon en mètres
                    }).addTo(this.map);
                    
                    // Activer le zoom molette au clic sur la carte
                    this.map.on('focus', () => { this.map.scrollWheelZoom.enable(); });
                    this.map.on('blur', () => { this.map.scrollWheelZoom.disable(); });
                    
                }, 100);
            }
        }
    }
</script>
