<!-- MOBILE FLOATING ACTION BUTTON (md:hidden) -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 md:hidden">
    <button @click="showMap = !showMap" 
            aria-label="Alterner entre la vue liste et la vue carte"
            class="flex items-center justify-center space-x-2 bg-[#1F2937] hover:bg-[#111827] text-white px-5 py-3 rounded-full shadow-lg text-xs font-bold transition-all active:scale-95">
        <!-- Show map icon when listing is active -->
        <span x-show="!showMap" class="flex items-center space-x-2">
            <i data-lucide="map" class="w-4 h-4"></i>
            <span>Afficher la carte</span>
        </span>
        <!-- Show list icon when map is active -->
        <span x-show="showMap" x-cloak class="flex items-center space-x-2">
            <i data-lucide="list" class="w-4 h-4"></i>
            <span>Afficher la liste</span>
        </span>
    </button>
</div>

<!-- DESKTOP SWITCHER BUTTONS (hidden md:flex) -->
<div class="hidden md:flex items-center bg-[#FAFAFA] border border-[#E5E7EB] p-1 rounded-xl select-none">
    <button @click="showMap = false" 
            aria-label="Afficher la vue liste"
            :class="!showMap ? 'bg-white border-[#E5E7EB] text-[#8B1E24] shadow-sm' : 'border-transparent text-[#6B7280]'"
            class="flex items-center space-x-1.5 px-3.5 py-2 border rounded-lg text-xs font-bold transition-all cursor-pointer">
        <i data-lucide="list" class="w-3.5 h-3.5"></i>
        <span>Liste</span>
    </button>
    <button @click="showMap = true" 
            aria-label="Afficher la vue carte"
            :class="showMap ? 'bg-white border-[#E5E7EB] text-[#8B1E24] shadow-sm' : 'border-transparent text-[#6B7280]'"
            class="flex items-center space-x-1.5 px-3.5 py-2 border rounded-lg text-xs font-bold transition-all cursor-pointer">
        <i data-lucide="map" class="w-3.5 h-3.5"></i>
        <span>Carte</span>
    </button>
</div>
