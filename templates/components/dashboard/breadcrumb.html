<nav class="flex" aria-label="Breadcrumb">
    <ol role="list" class="flex items-center space-x-4">
        <li>
            <div>
                <a href="{% url 'dashboard:home' %}" class="text-sm font-medium text-gray-400 hover:text-gray-500">
                    Accueil
                </a>
            </div>
        </li>
        {% if level1 %}
        <li>
            <div class="flex items-center">
                <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-gray-400"></i>
                <a href="{{ level1_url|default:'#' }}" class="ml-4 text-sm font-medium text-gray-500 hover:text-gray-700" aria-current="{{ level1_current|default:'false' }}">{{ level1 }}</a>
            </div>
        </li>
        {% endif %}
        {% if level2 %}
        <li>
            <div class="flex items-center">
                <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-gray-400"></i>
                <a href="{{ level2_url|default:'#' }}" class="ml-4 text-sm font-medium text-gray-500 hover:text-gray-700" aria-current="page">{{ level2 }}</a>
            </div>
        </li>
        {% endif %}
    </ol>
</nav>
