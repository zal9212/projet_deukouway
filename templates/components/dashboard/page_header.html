<div class="md:flex md:items-center md:justify-between mb-8 mt-2">
    <div class="min-w-0 flex-1">
        <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight">
            {{ title|default:"Dashboard" }}
        </h2>
        {% if description %}
        <p class="mt-1 text-sm text-gray-500">
            {{ description }}
        </p>
        {% endif %}
    </div>
    
    <div class="mt-4 flex md:ml-4 md:mt-0">
        {% if secondary_action %}
        <button type="button" class="inline-flex items-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors">
            {{ secondary_action }}
        </button>
        {% endif %}
        
        {% if primary_action %}
        <button type="button" class="ml-3 inline-flex items-center rounded-md bg-[#8B1E24] px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#6F171C] transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8B1E24]">
            {% if primary_icon %}
                <i data-lucide="{{ primary_icon }}" class="h-4 w-4 mr-1.5"></i>
            {% endif %}
            {{ primary_action }}
        </button>
        {% endif %}
    </div>
</div>
