<div class="bg-white shadow-sm ring-1 ring-gray-900/5 sm:rounded-xl md:col-span-2">
    <div class="px-4 py-6 sm:p-8">
        <div class="max-w-2xl space-y-10">
            <fieldset>
                <legend class="text-sm font-semibold leading-6 text-gray-900">Par Email</legend>
                <div class="mt-6 space-y-6">
                    <div class="relative flex gap-x-3">
                        <div class="flex h-6 items-center">
                            <input id="comments" name="comments" type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-[#8B1E24] focus:ring-[#8B1E24]">
                        </div>
                        <div class="text-sm leading-6">
                            <label for="comments" class="font-medium text-gray-900">Réservations</label>
                            <p class="text-gray-500">Soyez notifié quand un client réserve ou annule un séjour.</p>
                        </div>
                    </div>
                    <div class="relative flex gap-x-3">
                        <div class="flex h-6 items-center">
                            <input id="candidates" name="candidates" type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-[#8B1E24] focus:ring-[#8B1E24]">
                        </div>
                        <div class="text-sm leading-6">
                            <label for="candidates" class="font-medium text-gray-900">Paiements & Reçus</label>
                            <p class="text-gray-500">Recevez un email lorsque vous recevez un paiement.</p>
                        </div>
                    </div>
                </div>
            </fieldset>
            
            <fieldset>
                <legend class="text-sm font-semibold leading-6 text-gray-900">Notifications Push (Navigateur)</legend>
                <p class="mt-1 text-sm leading-6 text-gray-600">Ces notifications s'affichent sur votre écran même lorsque le dashboard est fermé.</p>
                <div class="mt-6 space-y-6">
                    <div class="flex items-center gap-x-3">
                        <input id="push-everything" name="push-notifications" type="radio" checked class="h-4 w-4 border-gray-300 text-[#8B1E24] focus:ring-[#8B1E24]">
                        <label for="push-everything" class="block text-sm font-medium leading-6 text-gray-900">Tout activer</label>
                    </div>
                    <div class="flex items-center gap-x-3">
                        <input id="push-email" name="push-notifications" type="radio" class="h-4 w-4 border-gray-300 text-[#8B1E24] focus:ring-[#8B1E24]">
                        <label for="push-email" class="block text-sm font-medium leading-6 text-gray-900">Seulement les urgences</label>
                    </div>
                    <div class="flex items-center gap-x-3">
                        <input id="push-nothing" name="push-notifications" type="radio" class="h-4 w-4 border-gray-300 text-[#8B1E24] focus:ring-[#8B1E24]">
                        <label for="push-nothing" class="block text-sm font-medium leading-6 text-gray-900">Aucune notification push</label>
                    </div>
                </div>
            </fieldset>
        </div>
    </div>
    <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8">
        <button type="button" class="text-sm font-semibold leading-6 text-gray-900 hover:text-[#8B1E24]">Annuler</button>
        <button type="submit" class="rounded-md bg-[#8B1E24] px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#6F171C] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8B1E24]">Enregistrer les préférences</button>
    </div>
</div>
