<div class="relative flex gap-x-4 p-4 hover:bg-gray-50 transition-colors {% if is_unread %}bg-white{% else %}bg-gray-50/30{% endif %}">
    
    <!-- Icône de statut -->
    <div class="relative mt-1 flex h-10 w-10 flex-none items-center justify-center rounded-full {% if type == 'reservation' %}bg-blue-50 text-blue-600{% elif type == 'payment' %}bg-green-50 text-green-600{% elif type == 'alert' %}bg-red-50 text-red-600{% else %}bg-gray-100 text-gray-600{% endif %}">
        {% if type == 'reservation' %}
            <i data-lucide="calendar" class="h-5 w-5"></i>
        {% elif type == 'payment' %}
            <i data-lucide="credit-card" class="h-5 w-5"></i>
        {% elif type == 'alert' %}
            <i data-lucide="shield-alert" class="h-5 w-5"></i>
        {% else %}
            <i data-lucide="info" class="h-5 w-5"></i>
        {% endif %}
        
        <!-- Indicateur non lu -->
        {% if is_unread %}
        <div class="absolute -right-1 -top-1 h-3 w-3 rounded-full bg-[#8B1E24] ring-2 ring-white"></div>
        {% endif %}
    </div>

    <!-- Contenu -->
    <div class="flex-auto">
        <div class="flex items-start justify-between gap-x-3">
            <p class="text-sm font-semibold leading-6 text-gray-900">{{ title }}</p>
            <p class="text-xs leading-6 text-gray-500 whitespace-nowrap">{{ time }}</p>
        </div>
        <p class="mt-1 text-sm leading-5 text-gray-600">{{ description }}</p>
        
        <!-- Actions intégrées (Optionnel) -->
        {% if action_text %}
        <div class="mt-3 flex items-center gap-x-3">
            <button type="button" class="rounded bg-white px-2 py-1 text-xs font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
                {{ action_text }}
            </button>
            {% if secondary_action %}
            <button type="button" class="text-xs font-semibold text-gray-500 hover:text-gray-700">
                {{ secondary_action }}
            </button>
            {% endif %}
        </div>
        {% endif %}
    </div>
    
    <!-- Menu contextuel (Options) -->
    <div class="absolute right-4 top-4 hidden group-hover:block" x-data="{ open: false }" @mouseleave="open = false">
        <button type="button" @click="open = !open" class="text-gray-400 hover:text-gray-500">
            <span class="sr-only">Options</span>
            <i data-lucide="more-horizontal" class="h-5 w-5"></i>
        </button>
        <div x-show="open" x-cloak class="absolute right-0 z-10 mt-1 w-32 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu">
            <div class="py-1">
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50" role="menuitem">Marquer lu</a>
                <a href="#" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50" role="menuitem">Supprimer</a>
            </div>
        </div>
    </div>
</div>
