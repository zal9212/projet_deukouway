{% if type == 'unread' %}
    <span class="inline-flex items-center rounded-full bg-[#8B1E24]/10 px-2 py-1 text-xs font-semibold text-[#8B1E24] ring-1 ring-inset ring-[#8B1E24]/20">
        Non lu
    </span>
{% elif type == 'urgent' %}
    <span class="inline-flex items-center rounded-full bg-red-50 px-2 py-1 text-xs font-semibold text-red-700 ring-1 ring-inset ring-red-600/20">
        <span class="h-1.5 w-1.5 rounded-full bg-red-600 mr-1.5"></span>
        Urgent
    </span>
{% elif type == 'success' %}
    <span class="inline-flex items-center rounded-full bg-green-50 px-2 py-1 text-xs font-semibold text-green-700 ring-1 ring-inset ring-green-600/20">
        Succès
    </span>
{% elif type == 'warning' %}
    <span class="inline-flex items-center rounded-full bg-yellow-50 px-2 py-1 text-xs font-semibold text-yellow-800 ring-1 ring-inset ring-yellow-600/20">
        Attention
    </span>
{% elif type == 'info' %}
    <span class="inline-flex items-center rounded-full bg-blue-50 px-2 py-1 text-xs font-semibold text-blue-700 ring-1 ring-inset ring-blue-600/20">
        Info
    </span>
{% else %}
    <span class="inline-flex items-center rounded-full bg-gray-50 px-2 py-1 text-xs font-semibold text-gray-600 ring-1 ring-inset ring-gray-500/20">
        {{ label|default:'Statut' }}
    </span>
{% endif %}
