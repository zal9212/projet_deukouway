<div class="text-center rounded-xl border-2 border-dashed border-gray-300 p-12 bg-gray-50/50">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 mb-4">
        <i data-lucide="{{ icon|default:'folder-open' }}" class="h-6 w-6 text-gray-400"></i>
    </div>
    <h3 class="mt-2 text-sm font-semibold text-gray-900">{{ title|default:"Aucune donnée" }}</h3>
    <p class="mt-1 text-sm text-gray-500">{{ description|default:"Il n'y a actuellement aucune donnée à afficher ici." }}</p>
    
    {% if action_text %}
    <div class="mt-6">
        <button type="button" class="inline-flex items-center rounded-md bg-[#8B1E24] px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#6F171C] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8B1E24] transition-colors">
            {% if action_icon %}
                <i data-lucide="{{ action_icon }}" class="h-4 w-4 mr-1.5"></i>
            {% endif %}
            {{ action_text }}
        </button>
    </div>
    {% endif %}
</div>
