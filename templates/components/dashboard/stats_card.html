<!-- Carte Statistique Reusable (Enterprise SaaS Tier) -->
<div class="overflow-hidden rounded-xl bg-white p-5 shadow-2xs border border-gray-200 hover:shadow-xs transition-all flex flex-col justify-between group">
    <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-500 truncate">{{ title }}</span>
        {% if icon %}
        <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 transition-colors {{ icon_bg|default:'bg-gray-100 text-gray-600' }} group-hover:scale-105">
            <i data-lucide="{{ icon }}" class="w-5 h-5"></i>
        </div>
        {% endif %}
    </div>

    <div class="mt-4 flex items-baseline justify-between">
        <div class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900">
            {{ value|default:"0" }}
        </div>

        {% if badge %}
        <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold {{ badge_class|default:'bg-green-50 text-green-700' }}">
            {% if badge_icon %}<i data-lucide="{{ badge_icon }}" class="w-3 h-3 mr-1"></i>{% endif %}
            {{ badge }}
        </span>
        {% endif %}
    </div>

    {% if subtitle %}
    <p class="mt-2 text-xs text-gray-500 truncate">{{ subtitle }}</p>
    {% endif %}
</div>
