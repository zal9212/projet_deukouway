<div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <div class="sm:flex sm:items-center sm:justify-between mb-4">
        <div>
            <h3 class="text-base font-semibold leading-6 text-gray-900">{{ title|default:"Graphique" }}</h3>
            {% if description %}
                <p class="mt-1 text-sm text-gray-500">{{ description }}</p>
            {% endif %}
        </div>
        <div class="mt-3 sm:ml-4 sm:mt-0">
            <!-- Période Selector -->
            <select class="block w-full rounded-md border-0 py-1.5 pl-3 pr-10 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-[#8B1E24] sm:text-sm sm:leading-6">
                <option>7 derniers jours</option>
                <option>30 derniers jours</option>
                <option>Cette année</option>
            </select>
        </div>
    </div>
    
    <!-- Zone d'affichage du graphique (Mock) -->
    <div class="h-72 w-full flex items-center justify-center bg-gray-50/50 rounded-lg border border-dashed border-gray-200">
        <div class="text-center">
            <i data-lucide="bar-chart-3" class="mx-auto h-8 w-8 text-gray-300 mb-2"></i>
            <span class="text-sm font-medium text-gray-400">Espace Graphique (Chart.js ou ApexCharts)</span>
        </div>
    </div>
</div>
