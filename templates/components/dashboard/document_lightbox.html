<!-- Visionneuse de documents (pièce d'identité / selfie) : superposition fermable,
     navigation par glissement horizontal (tactile) ou boutons flèche. -->
<div x-show="open" x-cloak
     class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center"
     @click="close()"
     @keydown.escape.window="close()"
     @keydown.arrow-left.window="prev()"
     @keydown.arrow-right.window="next()"
     @touchstart="onTouchStart($event)"
     @touchend="onTouchEnd($event)"
     x-transition.opacity>
    <button type="button" @click.stop="close()"
            class="absolute top-4 right-4 text-white/80 hover:text-white p-2 rounded-full hover:bg-white/10 transition-colors"
            aria-label="Fermer">
        <i data-lucide="x" class="w-7 h-7"></i>
    </button>

    <button type="button" x-show="items.length > 1" @click.stop="prev()"
            class="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 text-white/70 hover:text-white p-2 rounded-full hover:bg-white/10 transition-colors"
            aria-label="Image précédente">
        <i data-lucide="chevron-left" class="w-8 h-8"></i>
    </button>
    <button type="button" x-show="items.length > 1" @click.stop="next()"
            class="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 text-white/70 hover:text-white p-2 rounded-full hover:bg-white/10 transition-colors"
            aria-label="Image suivante">
        <i data-lucide="chevron-right" class="w-8 h-8"></i>
    </button>

    <div class="w-full max-h-[85vh] px-4" :class="items[index] && items[index].type === 'pdf' ? 'max-w-4xl' : 'max-w-3xl'" @click.stop>
        <template x-if="items[index] && items[index].type === 'pdf'">
            <iframe :src="items[index].url" :title="items[index].label"
                    class="w-full h-[75vh] rounded-lg bg-white border-0"></iframe>
        </template>
        <template x-if="!items[index] || items[index].type !== 'pdf'">
            <img :src="items[index] ? items[index].url : ''" :alt="items[index] ? items[index].label : ''"
                 class="max-w-full max-h-[75vh] mx-auto rounded-lg object-contain select-none" draggable="false">
        </template>
        <p class="text-center text-white/80 text-sm mt-3" x-text="items[index] ? items[index].label : ''"></p>
        <p class="text-center text-white/40 text-xs mt-1" x-show="items.length > 1" x-text="(index + 1) + ' / ' + items.length"></p>
    </div>
</div>

<script>
    function documentLightbox() {
        return {
            open: false,
            index: 0,
            items: [],
            touchStartX: 0,
            collectItems(root) {
                this.items = Array.from(root.querySelectorAll('[data-lightbox-item]')).map(el => ({
                    url: el.dataset.url,
                    label: el.dataset.label,
                    type: el.dataset.type || 'image',
                }));
            },
            openLightbox(el) {
                const clickedUrl = el.dataset.url;
                const found = this.items.findIndex(i => i.url === clickedUrl);
                this.index = found >= 0 ? found : 0;
                this.open = true;
            },
            next() { if (this.items.length) this.index = (this.index + 1) % this.items.length; },
            prev() { if (this.items.length) this.index = (this.index - 1 + this.items.length) % this.items.length; },
            close() { this.open = false; },
            onTouchStart(e) { this.touchStartX = e.changedTouches[0].clientX; },
            onTouchEnd(e) {
                const delta = e.changedTouches[0].clientX - this.touchStartX;
                if (Math.abs(delta) < 40) return;
                if (delta > 0) this.prev(); else this.next();
            },
        };
    }
</script>
