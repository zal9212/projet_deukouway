<!-- Modale globale de recherche (Ctrl+K) -->
<div x-show="searchOpen" 
     x-cloak 
     class="relative z-50" 
     role="dialog" 
     aria-modal="true">
    
    <!-- Backdrop -->
    <div x-show="searchOpen" 
         x-transition:enter="ease-out duration-300" 
         x-transition:enter-start="opacity-0" 
         x-transition:enter-end="opacity-100" 
         x-transition:leave="ease-in duration-200" 
         x-transition:leave-start="opacity-100" 
         x-transition:leave-end="opacity-0" 
         class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity"
         @click="searchOpen = false"></div>

    <div class="fixed inset-0 z-10 w-screen overflow-y-auto p-4 sm:p-6 md:p-20">
        <div x-show="searchOpen" 
             x-transition:enter="ease-out duration-300" 
             x-transition:enter-start="opacity-0 scale-95" 
             x-transition:enter-end="opacity-100 scale-100" 
             x-transition:leave="ease-in duration-200" 
             x-transition:leave-start="opacity-100 scale-100" 
             x-transition:leave-end="opacity-0 scale-95" 
             class="mx-auto max-w-2xl transform divide-y divide-gray-100 overflow-hidden rounded-2xl bg-white shadow-2xl ring-1 ring-black ring-opacity-5 transition-all"
             @click.stop>
             
            <!-- Formulaire de recherche -->
            <div class="relative">
                <i data-lucide="search" class="pointer-events-none absolute left-4 top-3.5 h-5 w-5 text-gray-400"></i>
                <input type="text" 
                       x-ref="searchInput"
                       x-init="$watch('searchOpen', value => { if(value) setTimeout(() => $refs.searchInput.focus(), 100) })"
                       class="h-12 w-full border-0 bg-transparent pl-11 pr-4 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm" 
                       placeholder="Rechercher des réservations, paiements, logements..." 
                       role="combobox" 
                       aria-expanded="false" 
                       aria-controls="options">
                <button type="button" @click="searchOpen = false" class="absolute right-4 top-3.5 text-xs font-semibold text-gray-500 hover:text-gray-700">
                    ESC
                </button>
            </div>

            <!-- Résultats / Empty State (Mock) -->
            <ul class="max-h-80 scroll-py-2 overflow-y-auto p-2 text-sm text-gray-700" id="options" role="listbox">
                <!-- Message initial ou pas de résultats -->
                <li class="p-4 text-center text-sm text-gray-500">
                    Commencez à taper pour lancer la recherche globale.
                </li>
            </ul>
            
        </div>
    </div>
</div>
