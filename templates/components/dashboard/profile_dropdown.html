<div class="relative" @click.outside="profileOpen = false">
    <button type="button" 
            class="-m-1.5 flex items-center p-1.5 focus:outline-none focus:ring-2 focus:ring-[#8B1E24] focus:ring-offset-2 rounded-full" 
            id="user-menu-button" 
            aria-expanded="false" 
            aria-haspopup="true"
            @click="profileOpen = !profileOpen">
        <span class="sr-only">Ouvrir le menu utilisateur</span>
        <img class="h-8 w-8 rounded-full bg-gray-50 object-cover border border-gray-200" src="https://ui-avatars.com/api/?name=Admin+User&background=8B1E24&color=fff" alt="Avatar">
        <span class="hidden lg:flex lg:items-center">
            <span class="ml-4 text-sm font-semibold leading-6 text-gray-900" aria-hidden="true">Admin User</span>
            <i data-lucide="chevron-down" class="ml-2 h-4 w-4 text-gray-400"></i>
        </span>
    </button>

    <!-- Dropdown menu -->
    <div x-show="profileOpen" 
         x-transition:enter="transition ease-out duration-100" 
         x-transition:enter-start="transform opacity-0 scale-95" 
         x-transition:enter-end="transform opacity-100 scale-100" 
         x-transition:leave="transition ease-in duration-75" 
         x-transition:leave-start="transform opacity-100 scale-100" 
         x-transition:leave-end="transform opacity-0 scale-95" 
         x-cloak
         class="absolute right-0 z-10 mt-2.5 w-56 origin-top-right rounded-md bg-white py-2 shadow-lg ring-1 ring-gray-900/5 focus:outline-none" 
         role="menu" 
         aria-orientation="vertical" 
         aria-labelledby="user-menu-button" 
         tabindex="-1">
         
        <div class="px-4 py-3 border-b border-gray-100">
            <p class="text-sm font-medium text-gray-900 truncate">admin@dekouway.com</p>
            <p class="text-xs text-gray-500 mt-0.5">Rôle: SuperAdmin</p>
        </div>
         
        <a href="#" class="block px-4 py-2 text-sm leading-6 text-gray-700 hover:bg-gray-50 flex items-center" role="menuitem" tabindex="-1">
            <i data-lucide="user" class="w-4 h-4 mr-2 text-gray-400"></i> Mon profil
        </a>
        <a href="#" class="block px-4 py-2 text-sm leading-6 text-gray-700 hover:bg-gray-50 flex items-center" role="menuitem" tabindex="-1">
            <i data-lucide="settings" class="w-4 h-4 mr-2 text-gray-400"></i> Paramètres
        </a>
        
        <div class="border-t border-gray-100 my-1"></div>
        
        <a href="#" class="block px-4 py-2 text-sm leading-6 text-red-600 hover:bg-red-50 flex items-center font-medium" role="menuitem" tabindex="-1">
            <i data-lucide="log-out" class="w-4 h-4 mr-2 text-red-500"></i> Se déconnecter
        </a>
    </div>
</div>
