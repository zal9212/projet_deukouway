<div class="p-4 rounded-xl border flex items-start space-x-3 text-sm {{ color_class|default:'bg-blue-50 border-blue-200 text-blue-800' }} {{ extra_class }}">
    {% if icon %}
        <span class="p-1 rounded bg-white border {{ icon_border_class|default:'border-blue-200 text-blue-600' }}">
            <i data-lucide="{{ icon }}" class="w-4 h-4"></i>
        </span>
    {% endif %}
    <div class="flex-grow">
        {% if title %}
            <h5 class="font-bold mb-1">{{ title }}</h5>
        {% endif %}
        <div class="leading-relaxed">
            {{ body }}
        </div>
    </div>
</div>
