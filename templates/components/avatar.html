<div class="relative inline-block {{ size|default:'w-8 h-8' }} {{ extra_class }}">
    {% if src %}
        <img src="{{ src }}" alt="avatar" class="w-full h-full rounded-full object-cover border border-[#E5E7EB]">
    {% else %}
        <div class="w-full h-full rounded-full bg-[#8B1E24] text-white flex items-center justify-center font-bold text-xs select-none">
            {{ label|slice:":1"|upper|default:'U' }}
        </div>
    {% endif %}
    {% if online %}
        <span class="absolute bottom-0 right-0 block w-2 h-2 rounded-full bg-[#16A34A] ring-2 ring-white"></span>
    {% endif %}
</div>
