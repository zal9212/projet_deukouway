<!-- Template utilisé par Leaflet pour générer le contenu du popup -->
<template id="map-popup-template">
    <a href="[[url]]" class="flex flex-col w-[240px] rounded-2xl overflow-hidden group hover:shadow-lg transition-shadow">
        <!-- Image -->
        <div class="relative w-full h-[160px] bg-gray-200">
            <img src="[[image]]" alt="[[title]]" class="w-full h-full object-cover" loading="lazy">
        </div>

        <!-- Contenu -->
        <div class="p-4 bg-white flex flex-col gap-1">
            <div class="flex justify-between items-start">
                <h3 class="font-bold text-gray-900 text-sm line-clamp-1">[[title]]</h3>
                <div class="flex items-center text-xs font-semibold">
                    <i data-lucide="star" class="w-3 h-3 text-yellow-500 mr-1 fill-current"></i>
                    [[rating]]
                </div>
            </div>
            <p class="text-xs text-gray-500 line-clamp-1">[[neighborhood]]</p>

            <div class="mt-2 text-sm">
                <span class="font-bold text-gray-900">[[price]]</span>
                <span class="text-gray-500"> [[unit]]</span>
            </div>
        </div>
    </a>
</template>

<style>
    /* Surcharges Leaflet pour retirer les styles par défaut du popup */
    .leaflet-popup-content-wrapper {
        padding: 0 !important;
        border-radius: 1rem !important; /* 16px to match Tailwind's rounded-2xl */
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1) !important;
    }
    .leaflet-popup-content {
        margin: 0 !important;
        width: 240px !important;
    }
    .leaflet-popup-tip-container {
        display: none; /* Cacher la petite flèche par défaut pour un design plus épuré (optionnel) */
    }
    a.leaflet-popup-close-button {
        color: white !important;
        padding: 8px !important;
        z-index: 10;
        text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
</style>
