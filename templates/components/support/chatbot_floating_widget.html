<div x-data class="relative z-50">

    <!-- Bouton Flottant (FAB - Floating Action Button) -->
    <button @click="$store.chat.open = !$store.chat.open"
            type="button"
            class="fixed bottom-5 right-6 z-40 flex items-center gap-2 rounded-full bg-[#8B1E24] px-4 py-3 text-white shadow-xl hover:bg-[#6F171C] transition-all transform hover:scale-105 active:scale-95 focus:outline-none ring-4 ring-[#8B1E24]/20"
            aria-label="Assistant IA DEKOUWAY">
        <i data-lucide="bot" class="w-6 h-6" x-show="!$store.chat.open"></i>
        <i data-lucide="x" class="w-6 h-6" x-show="$store.chat.open" x-cloak></i>
        <span class="text-xs font-bold hidden sm:inline" x-show="!$store.chat.open">Assistant IA</span>
    </button>

    <!-- Fenêtre Pop-up de Chat (Floating Window) -->
    <div x-show="$store.chat.open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 scale-95"
         x-cloak
         class="fixed bottom-20 right-6 z-50 w-80 sm:w-96 h-[460px] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
        
        <!-- Entête du Chatbot -->
        <div class="bg-slate-900 px-4 py-3 text-white flex items-center justify-between border-b border-slate-800">
            <div class="flex items-center space-x-2.5">
                <div class="relative">
                    <div class="w-8 h-8 rounded-full bg-[#8B1E24] text-white flex items-center justify-center font-extrabold text-xs shadow-xs">
                        DK
                    </div>
                    <span class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-emerald-500 ring-2 ring-slate-900"></span>
                </div>
                <div>
                    <h3 class="text-xs font-bold tracking-tight">Assistant DEKOUWAY</h3>
                    <p class="text-[10px] text-slate-400">Support 24/7 & IA</p>
                </div>
            </div>
            <button @click="$store.chat.open = false" class="text-slate-400 hover:text-white transition-colors p-1">
                <i data-lucide="minus" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Zone des Messages -->
        <div id="floating-chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50">
            <div class="flex items-start space-x-2.5 max-w-[88%]">
                <div class="w-7 h-7 rounded-full bg-[#8B1E24] text-white flex items-center justify-center flex-shrink-0 font-bold text-[10px]">
                    DK
                </div>
                <div class="p-3 bg-white rounded-2xl rounded-tl-none border border-slate-200 text-xs text-slate-800 shadow-xs leading-relaxed">
                    <p class="font-bold text-[10px] text-slate-500 mb-1">Assistant DEKOUWAY</p>
                    <p>Bonjour ! Comment puis-je vous aider aujourd'hui ? Posez-moi vos questions sur la réservation, les logements ou les paiements.</p>
                </div>
            </div>
        </div>

        <!-- Barre de saisie -->
        <form id="floating-chat-form" 
              hx-post="{% url 'support:chatbot_response' %}" 
              hx-target="#floating-chat-messages" 
              hx-swap="beforeend" 
              class="p-3 bg-white border-t border-slate-200 flex items-center space-x-2"
              onsubmit="setTimeout(() => { document.getElementById('floating-message-input').value = ''; }, 50);">
            {% csrf_token %}
            <input type="text" 
                   id="floating-message-input" 
                   name="message" 
                   required 
                   placeholder="Posez votre question..." 
                   class="flex-1 px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-1 focus:ring-[#8B1E24]">
            <button type="submit" class="p-2 bg-[#8B1E24] hover:bg-[#6F171C] text-white rounded-xl shadow-xs transition-colors">
                <i data-lucide="send" class="w-4 h-4"></i>
            </button>
        </form>
    </div>

</div>
