{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:24px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="background-color:#8B1E24;padding:24px 32px;">
                            <span style="color:#ffffff;font-size:20px;font-weight:bold;">KYI IMMOBILIER</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h1 style="margin:0 0 16px;font-size:20px;color:#111827;">{{ title }}</h1>
                            <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#374151;">{{ message|linebreaksbr }}</p>
                            {% if link %}
                            <p style="margin:24px 0;">
                                <a href="{{ link }}" style="display:inline-block;background-color:#8B1E24;color:#ffffff;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:bold;">Suivre le lien</a>
                            </p>
                            {% endif %}
                            <p style="margin:24px 0 0;font-size:12px;color:#9ca3af;border-top:1px solid #e5e7eb;padding-top:16px;">
                                Merci d'utiliser KYI IMMOBILIER.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
