version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=dekouway_db
      - POSTGRES_USER=dekouway_user
      - POSTGRES_PASSWORD=dekouway_password
    restart: always

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 dekouway.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-secret-key-change-me-immediately
      - DATABASE_URL=postgres://dekouway_user:dekouway_password@db:5432/dekouway_db
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - SECURE_SSL_REDIRECT=False
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
