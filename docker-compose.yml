version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dekouway_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dekouway_db}
      POSTGRES_USER: ${POSTGRES_USER:-dekouway_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de "ports:" : seul le service "web" doit joindre PostgreSQL, via le
    # réseau interne docker-compose (nom de service "db" comme host). Exposer
    # 5432 sur l'hôte rendrait la base directement joignable depuis l'extérieur
    # en production. Pour un accès ponctuel en local : `docker compose exec db psql ...`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dekouway_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dekouway_redis
    restart: always
    # Idem que "db" : Redis (cache + compteurs de rate-limiting) ne doit être
    # joignable que par "web" sur le réseau interne, jamais depuis l'hôte.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: dekouway_web
    restart: always
    command: gunicorn --config gunicorn.conf.py dekouway.wsgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: dekouway_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
