name: DEKOUWAY CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Linting & Unit/API/AI Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dekouway_test_db
          POSTGRES_USER: dekouway_user
          POSTGRES_PASSWORD: securepassword123
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migrations Check
        env:
          POSTGRES_DB: dekouway_test_db
          POSTGRES_USER: dekouway_user
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Test Suite Under Coverage
        env:
          POSTGRES_DB: dekouway_test_db
          POSTGRES_USER: dekouway_user
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          GROQ_API_KEY: mock-key
        run: |
          python -m coverage run manage.py test apps.accounts.tests apps.properties.tests apps.reservations.tests apps.payments.tests apps.notifications.tests apps.documents.tests apps.support.tests apps.dashboard.tests apps.ai.tests apps.core.tests
          python -m coverage report --fail-under=80

  docker-build:
    name: Docker Container Build Check
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t dekouway:latest .
