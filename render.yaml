services:
  - type: web
    name: dekouway
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Pas de startCommand : non supporté avec runtime "docker" (Render l'a
    # rejeté au blueprint). La séquence migrate + gunicorn vit dans le CMD de
    # l'image (entrypoint.sh), collectstatic reste au build dans le Dockerfile.
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: dekouway-db
          property: connectionString
      # CACHE_BACKEND volontairement absent : bascule automatiquement sur
      # LocMemCache (voir settings.py), aucun Redis payant nécessaire pour tester.
      - key: METRICS_TOKEN
        generateValue: true
      # Optionnel : renseignez ces valeurs dans le tableau de bord Render si vous
      # voulez que les photos de logements survivent aux redémarrages (le disque
      # du plan gratuit est éphémère). Sans ça, l'appli fonctionne quand même,
      # mais les images uploadées disparaissent à chaque redéploiement.
      - key: CLOUDINARY_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: dekouway-db
    plan: free
    region: frankfurt
